<!DOCTYPE html>
<!-- 选择题弹窗重设计·变体 3「单页全览表单」（推荐基准）。
     治的病（用户 4 条抱怨的结构性解法）：
       ① 自由跳题 → 不再翻页，全部题目同屏，点击即达；右缘 mini-map 锚点跳转。
       ② 上下一步都不行 → 根本没有上下一步；唯一主按钮「提交」，未答题时给出行内指引。
       ③ 已答标识 → 每题卡常显状态：已答=选项高亮+题号绿✓；未答=空心号+「未作答」角标。
       ④ 取消夹中间 → footer 仅 [取消 ghost][提交 primary]，遵守全局 [取消][主按钮] 惯例。
     字段映射（以调研报告 C-question-dialog.md 的 buildWizardAskUserQuestionPayload 现状为准）：
       题干=question 文本；选项=options[]（尾部自动追加 __other__ Other 项，含行内输入）；
       多选=multiSelect；进度=已答数/总数；本变体移除 wizardIndex 分页状态机。
     交互裁决（我的决定，计划评审可推翻）：
       · 单选/多选均点击即暂存（草稿态），提交时一次性回传全部答案；
       · 提交钮恒可见，未答齐时点击 → 滚动定位到首个未答题 + 卡片警示描边（不弹 toast）；
       · 有作答时取消/X/Esc → 二次确认「丢弃 N 题作答？」；输入框内 Esc 仅失焦不关弹窗；
       · Other 行内输入即时暂存，跳转/滚动不丢文本（治 jumpToQuestion 丢 Other 的既有缺陷）。
     token 纪律：全 var(--color-*)/var(--radius-*)/color-mix(...)（镜像 variables.css 默认 warm-paper
     与 constants.ts「终端」暗板 + interaction-tokens.css 面板尺寸 57.5rem/圆角 1rem/遮罩 z1200）。
     差异点登记：单页滚动 / 无翻页态 / 右缘 mini-map / 题卡式布局 / 提交即时校验。 -->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>选择题弹窗·变体 3「单页全览」</title>
<style>
  /* ── 真实 token 镜像（亮=variables.css 默认；暗=constants.ts「终端」板）── */
  :root {
    --color-bg: #F8F4ED; --color-panel: #F4F0EA; --color-panel-soft: #FCFAF5;
    --color-border: rgba(122, 96, 88, 0.18); --color-border-strong: rgba(0, 0, 0, 0.12);
    --color-text: #3B3D3F; --color-text-muted: #6A6C70;
    --color-accent: #537D96; --color-accent-strong: #456A80; --color-on-accent: #FFFFFF;
    --color-danger: #8B3A3A; --color-success: #4A9E5E;
    --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
    --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.06);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --duration-fast: 120ms; --duration-base: 200ms;
    --interaction-overlay-bg: rgba(0, 0, 0, 0.58);
    --interaction-panel-width-wide: min(57.5rem, 94vw);
    --interaction-panel-radius: 1rem;
    --interaction-shadow: 0 18px 60px rgba(0, 0, 0, 0.46);
    --interaction-option-bg: color-mix(in srgb, var(--color-panel-soft) 88%, #000);
    --interaction-option-selected-bg: color-mix(in srgb, var(--color-accent) 34%, var(--color-panel-soft));
    --interaction-btn-radius: var(--radius-md);
    --interaction-btn-pad: 0.5rem 1rem;
  }
  [data-theme="dark"] {
    --color-bg: #0F1115; --color-panel: #14171C; --color-panel-soft: #1B2027;
    --color-border: #23272F; --color-border-strong: #2E3440;
    --color-text: #D3D8E0; --color-text-muted: #9AA3B2;
    --color-accent: #4EA1FF; --color-accent-strong: #7FBAFF; --color-on-accent: #0B1220;
    --color-danger: #E5484D; --color-success: #57B26B;
    --interaction-shadow: 0 18px 60px rgba(0, 0, 0, 0.7);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--color-bg); color: var(--color-text); font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; padding: 24px 32px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  .toolbar h1 { font-size: 15px; font-weight: 600; margin-right: auto; }
  .toolbar small { color: var(--color-text-muted); }
  .toolbar button { border: 1px solid var(--color-border); background: var(--color-panel-soft); color: var(--color-text); border-radius: var(--radius-sm); padding: 4px 10px; font: inherit; cursor: pointer; }
  .stage { position: relative; min-height: 640px; display: grid; place-items: center; }

  /* ── 遮罩与面板（镜像 InteractionPrompt 壳）── */
  .overlay { position: absolute; inset: 0; background: var(--interaction-overlay-bg); border-radius: var(--radius-lg); display: grid; place-items: center; z-index: 1200; }
  .panel {
    width: var(--interaction-panel-width-wide);
    background: var(--color-panel); border-radius: var(--interaction-panel-radius);
    box-shadow: var(--interaction-shadow); display: flex; flex-direction: column;
    max-height: 82vh; overflow: hidden;
    animation: pop var(--duration-base) var(--ease-spring);
  }
  @keyframes pop { from { transform: scale(0.96); opacity: 0; } }

  /* ── 头部：标题 + 已答进度（进度常显，替代旧 N/M 圆点行）── */
  .head { display: flex; align-items: center; gap: 10px; padding: 1.125rem 1.375rem 0.75rem; border-bottom: 1px solid var(--color-border); }
  .head .title { font-size: 15px; font-weight: 600; }
  .head .sub { font-size: 12px; color: var(--color-text-muted); }
  .progress { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .progress .bar { width: 120px; height: 6px; border-radius: 999px; background: var(--interaction-option-bg); overflow: hidden; }
  .progress .bar i { display: block; height: 100%; width: 50%; background: var(--color-accent); border-radius: 999px; transition: width var(--duration-base) var(--ease-out); }
  .progress .num { font-size: 12px; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }

  /* ── 主体：题卡单页滚动 + 右缘 mini-map ── */
  .body { position: relative; display: flex; min-height: 0; flex: 1; }
  .scroll { flex: 1; overflow-y: auto; padding: 1rem 1.125rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .qcard {
    scroll-margin: 12px;
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-panel-soft); padding: 12px 14px; position: relative;
    transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out);
  }
  .qcard.unanswered { border-style: dashed; }
  .qcard.flagged { border-color: var(--color-danger); border-style: solid; animation: nudge 0.3s var(--ease-spring); }
  @keyframes nudge { 0% { transform: translateX(0); } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } 100% { transform: translateX(0); } }
  .qhead { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .qnum { flex: none; width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--interaction-option-bg); color: var(--color-text-muted); }
  .qcard.answered .qnum { background: var(--color-success); color: #fff; }
  .qtag { margin-left: auto; font-size: 11px; color: var(--color-text-muted); display: flex; gap: 6px; align-items: center; }
  .qtag.multi { border: 1px solid var(--color-border); border-radius: 999px; padding: 1px 8px; }
  .qtag .miss { color: var(--color-danger); }
  .qtext { font-size: 14px; font-weight: 600; }

  /* 选项（复用 InteractionOptionList 视觉：块状选项、选中 accent 34% 混色） */
  .opts { display: flex; flex-direction: column; gap: var(--interaction-option-gap); margin-top: 10px; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px; text-align: left;
    padding: 9px 12px; border-radius: var(--radius-sm); border: 1px solid var(--color-border);
    background: var(--interaction-option-bg); color: var(--color-text); font: inherit; cursor: pointer;
    transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
  }
  .opt:hover { background: color-mix(in srgb, var(--color-text) 5%, var(--interaction-option-bg)); }
  .opt .mark { flex: none; margin-top: 2px; width: 15px; height: 15px; border-radius: 999px; border: 1.5px solid var(--color-text-muted); display: grid; place-items: center; font-size: 10px; color: transparent; }
  .opt.multi .mark { border-radius: 4px; }
  .opt.checked { background: var(--interaction-option-selected-bg); border-color: var(--color-accent); }
  .opt.checked .mark { border-color: var(--color-accent); background: var(--color-accent); color: var(--color-on-accent); }
  .opt .label b { display: block; font-weight: 600; font-size: 13px; }
  .opt .label small { color: var(--color-text-muted); font-size: 12px; }
  .other-input {
    margin-top: 6px; width: 100%; font: inherit; font-size: 13px; color: var(--color-text);
    background: var(--color-panel); border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 7px 10px;
  }
  .other-input:focus { outline: 2px solid color-mix(in srgb, var(--color-accent) 45%, transparent); outline-offset: 1px; }

  /* ── mini-map 锚点（右缘竖排圆点，替代旧 header 圆点行；可点跳转）── */
  .map { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 10px; border-left: 1px solid var(--color-border); }
  .map button { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--color-text-muted); background: transparent; cursor: pointer; padding: 0; position: relative; }
  .map button.answered { background: var(--color-success); border-color: var(--color-success); }
  .map button.current { border-color: var(--color-accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-accent) 30%, transparent); }
  .map button::after { content: attr(data-n); position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--color-text-muted); background: var(--color-panel); border: 1px solid var(--color-border); border-radius: 4px; padding: 1px 6px; opacity: 0; pointer-events: none; transition: opacity var(--duration-fast) var(--ease-out); white-space: nowrap; }
  .map button:hover::after { opacity: 1; }

  /* ── footer：仅 [取消][提交]，遵守全局惯例；未答齐的提交给行内指引 ── */
  .foot { display: flex; align-items: center; gap: 10px; padding: 0.875rem 1.125rem 1.125rem; border-top: 1px solid var(--color-border); }
  .foot .hint { font-size: 12px; color: var(--color-text-muted); margin-right: auto; }
  .foot .hint b { color: var(--color-danger); font-weight: 600; }
  .btn { border-radius: var(--interaction-btn-radius); padding: var(--interaction-btn-pad); font: inherit; font-size: 13px; cursor: pointer; transition: background var(--duration-fast) var(--ease-out); }
  .btn.ghost { background: transparent; border: 1px solid var(--color-border); color: var(--color-text); }
  .btn.ghost:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
  .btn.primary { background: var(--color-accent); border: 1px solid var(--color-accent); color: var(--color-on-accent); font-weight: 600; }
  .btn.primary:hover { background: var(--color-accent-strong); }

  /* ── 丢弃确认（取代旧「Esc 直接整单丢弃」）── */
  .confirm { position: absolute; inset: 0; background: var(--interaction-overlay-bg); display: grid; place-items: center; z-index: 10; border-radius: var(--interaction-panel-radius); }
  .confirm .box { width: 320px; background: var(--color-panel); border-radius: var(--radius-md); box-shadow: var(--interaction-shadow); padding: 16px; }
  .confirm h3 { font-size: 14px; margin-bottom: 6px; }
  .confirm p { font-size: 12px; color: var(--color-text-muted); margin-bottom: 14px; }
  .confirm .row { display: flex; justify-content: flex-end; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>变体 3 · 单页全览表单（推荐）</h1>
    <small>全部题目同屏 · 无上下一步 · 右缘锚点 · 提交时校验</small>
    <button onclick="setTheme('light')">浅色</button>
    <button onclick="setTheme('dark')">深色</button>
  </div>

  <div class="stage">
    <div class="overlay">
      <div class="panel" id="panel">
        <div class="head">
          <div>
            <div class="title">会话导出设置</div>
            <div class="sub">回答全部问题后一次性提交 · 点击任意题目直接修改</div>
          </div>
          <div class="progress">
            <div class="bar"><i id="bar"></i></div>
            <span class="num" id="num">2/4 已答</span>
          </div>
        </div>

        <div class="body">
          <div class="scroll" id="scroll">
            <!-- Q1 已答：题号绿✓、选中选项 accent 高亮 -->
            <section class="qcard answered" id="q1" data-answered="1">
              <div class="qhead"><span class="qnum">✓</span><span class="qtext">导出格式？</span></div>
              <div class="opts" data-q="1" data-multi="0">
                <button class="opt" data-v="JPG"><span class="mark">✓</span><span class="label"><b>JPG</b><small>体积小，适合分享</small></span></button>
                <button class="opt checked" data-v="PNG"><span class="mark">✓</span><span class="label"><b>PNG</b><small>无损画质，支持透明</small></span></button>
                <button class="opt" data-v="PDF"><span class="mark">✓</span><span class="label"><b>PDF</b><small>适合打印与归档</small></span></button>
              </div>
            </section>

            <!-- Q2 未答：虚线边 + 未作答角标 -->
            <section class="qcard unanswered" id="q2" data-answered="0">
              <div class="qhead"><span class="qnum">2</span><span class="qtext">导出范围？</span><span class="qtag"><span class="miss">未作答</span></span></div>
              <div class="opts" data-q="2" data-multi="0">
                <button class="opt" data-v="当前会话"><span class="mark"></span><span class="label"><b>当前会话</b></span></button>
                <button class="opt" data-v="全部会话"><span class="mark"></span><span class="label"><b>全部会话</b></span></button>
                <button class="opt" data-v="仅收藏"><span class="mark"></span><span class="label"><b>仅收藏</b></span></button>
              </div>
            </section>

            <!-- Q3 多选·已选 2 项 -->
            <section class="qcard answered" id="q3" data-answered="1">
              <div class="qhead"><span class="qnum">✓</span><span class="qtext">附带哪些元数据？</span><span class="qtag multi">多选 · 已选 2 项</span></div>
              <div class="opts" data-q="3" data-multi="1">
                <button class="opt multi checked" data-v="时间戳"><span class="mark">✓</span><span class="label"><b>时间戳</b></span></button>
                <button class="opt multi checked" data-v="会话名"><span class="mark">✓</span><span class="label"><b>会话名</b></span></button>
                <button class="opt multi" data-v="模型信息"><span class="mark"></span><span class="label"><b>模型信息</b></span></button>
                <button class="opt multi" data-v="附件清单"><span class="mark"></span><span class="label"><b>附件清单</b></span></button>
              </div>
            </section>

            <!-- Q4 单选 + Other 行内输入（即时暂存，滚动/跳转不丢） -->
            <section class="qcard unanswered" id="q4" data-answered="0">
              <div class="qhead"><span class="qnum">4</span><span class="qtext">文件名模板？</span><span class="qtag"><span class="miss">未作答</span></span></div>
              <div class="opts" data-q="4" data-multi="0">
                <button class="opt" data-v="默认时间戳"><span class="mark"></span><span class="label"><b>默认时间戳</b><small>export-20261115-1430</small></span></button>
                <button class="opt" data-v="会话名"><span class="mark"></span><span class="label"><b>会话名</b></span></button>
                <button class="opt" data-v="__other__" id="otherBtn"><span class="mark"></span><span class="label"><b>Other</b><small>自定义模板</small></span></button>
              </div>
              <input class="other-input hidden" id="otherInput" placeholder="输入自定义模板，如 {会话名}-{日期}" />
            </section>
          </div>

          <!-- mini-map：状态一目了然（绿=已答 / 空心=未答 / 描边=视口当前），点击滚动直达 -->
          <nav class="map" id="map">
            <button data-t="q1" class="answered" data-n="1 导出格式 ✓"></button>
            <button data-t="q2" data-n="2 导出范围（未答）"></button>
            <button data-t="q3" class="answered" data-n="3 元数据 ✓"></button>
            <button data-t="q4" data-n="4 文件名模板（未答）"></button>
          </nav>
        </div>

        <div class="foot">
          <span class="hint" id="hint">已答 2/4 · 提交前会定位到未答题</span>
          <button class="btn ghost" id="cancelBtn">取消</button>
          <button class="btn primary" id="submitBtn">提交（2/4）</button>
        </div>

        <!-- 有作答时的取消二次确认 -->
        <div class="confirm hidden" id="confirmBox">
          <div class="box">
            <h3>丢弃本次作答？</h3>
            <p>已作答的 2 题内容将被丢弃，模型不会收到任何回答。</p>
            <div class="row">
              <button class="btn ghost" onclick="closeConfirm()">继续作答</button>
              <button class="btn primary" style="background:var(--color-danger);border-color:var(--color-danger)" onclick="closeConfirm()">丢弃</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  function setTheme(t) { document.documentElement.dataset.theme = t; }

  function refresh() {
    const cards = $$('.qcard');
    const answered = cards.filter(c => c.dataset.answered === '1').length;
    $('#num').textContent = answered + '/' + cards.length + ' 已答';
    $('#bar').style.width = (answered / cards.length * 100) + '%';
    $('#submitBtn').textContent = answered === cards.length ? '提交' : '提交（' + answered + '/' + cards.length + '）';
    $('#hint').innerHTML = answered === cards.length
      ? '已答 ' + answered + '/' + cards.length + ' · 可提交'
      : '已答 ' + answered + '/' + cards.length + ' · <b>还有 ' + (cards.length - answered) + ' 题未答</b>，提交时会自动定位';
    // mini-map 状态同步
    $$('#map button').forEach(b => {
      const card = $('#' + b.dataset.t);
      b.classList.toggle('answered', card.dataset.answered === '1');
    });
  }

  // 选项点击：单选即选；Other 展开输入框
  $$('.opts').forEach(group => {
    const q = group.dataset.q, multi = group.dataset.multi === '1';
    $$('.opt', group).forEach(btn => btn.addEventListener('click', () => {
      if (btn.dataset.v === '__other__') {
        $('#otherInput').classList.remove('hidden');
        $('#otherInput').focus();
        return;
      }
      if (multi) { btn.classList.toggle('checked'); }
      else { $$('.opt', group).forEach(b => b.classList.remove('checked')); btn.classList.add('checked'); }
      const has = $$('.opt.checked', group).length > 0 || (q === '4' && $('#otherInput').value.trim() !== '');
      const card = $('#q' + q);
      card.classList.toggle('answered', has);
      card.classList.toggle('unanswered', !has);
      card.classList.remove('flagged');
      $('.qnum', card).textContent = has ? '✓' : q;
      refresh();
    }));
  });
  $('#otherInput').addEventListener('input', () => {
    const has = $('#otherInput').value.trim() !== '' || $$('#q4 .opt.checked').length > 0;
    $('#q4').classList.toggle('answered', has);
    $('#q4').classList.toggle('unanswered', !has);
    refresh();
  });

  // mini-map 锚点跳转：点击即滚动到对应题目
  $$('#map button').forEach(b => b.addEventListener('click', () => {
    $$('#map button').forEach(x => x.classList.remove('current'));
    b.classList.add('current');
    $('#' + b.dataset.t).scrollIntoView({ behavior: 'smooth', block: 'start' });
  }));

  // 提交：未答齐 → 定位首个未答 + 警示描边（不弹 toast）
  $('#submitBtn').addEventListener('click', () => {
    const first = $$('.qcard').find(c => c.dataset.answered !== '1');
    if (first) {
      first.classList.remove('flagged'); void first.offsetWidth; first.classList.add('flagged');
      first.scrollIntoView({ behavior: 'smooth', block: 'center' });
      $('.qtag', first).innerHTML = '<span class="miss">还有这题没答</span>';
    } else { $('#hint').textContent = '已全部作答，提交成功（演示终止）'; }
  });

  // 取消/X：有作答 → 二次确认；无作答 → 直接关
  $('#cancelBtn').addEventListener('click', () => {
    if ($$('.qcard.answered').length > 0) $('#confirmBox').classList.remove('hidden');
    else $('#hint').textContent = '已取消（演示终止）';
  });
  function closeConfirm() { $('#confirmBox').classList.add('hidden'); }
</script>
</body>
</html>
