<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多供应商 × 模型管理 · V1-r9 定稿候选</title>
<!--
  多供应商模型管理 — V1 定版迭代 r9（设置页 = 可选项库，会话内选用）
  ══════════════════════════════════════════════════════════════
  · 职责边界（用户定调）：设置页只负责「添加可选的供应商与模型」；
    选用哪个供应商 / 哪个模型，在会话内自由选择（无「使用中」/
    「设为当前使用」/默认模型等选用语义）。
  · 布局（r6）：
      0. 工作区固定 3:2 宽高比；宽度 = min(容器宽, 高×1.5)
         （容器查询 cq 单位实现）：窗口拖动时按比例自适应，
         高度受限时以高度定宽并水平居中
      1. 所有尺寸用 rem：外观页原有字号下拉（小/中/大）生效时，
         整体按应用 fontScale 体系缩放；页头不额外提供字号控件
      2. 供应商列表栏与详情框紧挨着拼成一个面；滚动全部发生在面板
         内部（左栏条目/右侧模型区），卡头（查询模型）与表尾常驻
      3. 左栏 = 新建按钮 + 供应商条目；新建时详情框整体切换为表单
      4. 「查询模型」组合框：下拉点击即添加 / 下拉内手动输入 +
         「确认」按钮（在拉框内）；输入兼作过滤器；ESC/点外部关闭
      5. 模型每行右侧「测试」按钮：单模型连接测试（加载→通过/失败）
  · 对照版本：v1 / v2 / v3 / r2a-rail / r2b（历史）。
  · 视觉：与主应用同源 token（warm-paper）。
-->
<style>
  :root {
    color-scheme: light;
    --color-bg: #F8F4ED; --color-panel: #F4F0EA; --color-panel-soft: #FCFAF5;
    --color-border: rgba(122, 96, 88, 0.18); --color-border-strong: rgba(0, 0, 0, 0.12);
    --color-text: #3B3D3F; --color-text-muted: #6A6C70;
    --color-accent: #537D96; --color-accent-strong: #456A80; --color-on-accent: #FFFFFF;
    --color-danger: #8B3A3A; --color-success: #4A9E5E; --color-success-strong: #2E7D46; --color-info: #3B7DD8;
    --radius-xs: 0.25rem; --radius-sm: 0.5rem; --radius-md: 0.75rem; --radius-lg: 1rem; --radius-pill: 999px;
    --elevation-1: 0 1px 2px rgba(0,0,0,0.06);
    --elevation-2: 0 4px 12px rgba(0,0,0,0.08);
    --elevation-3: 0 12px 32px rgba(0,0,0,0.12);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms;
    --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
    --font-size-base: 16px;
    font-size: var(--font-size-base);
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --duration-fast: 1ms; --duration-base: 1ms; --duration-slow: 1ms; --ease-spring: var(--ease-out); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 1rem; line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg { flex: none; }
  [hidden] { display: none !important; }

  .app { display: flex; height: 100vh; }
  .app-nav { width: 12.5rem; flex: none; background: var(--color-panel); border-right: 1px solid var(--color-border-strong); padding: 0.875rem 0.625rem; }
  .app-brand { font-weight: 700; font-size: 0.9rem; padding: 0.375rem 0.625rem 0.875rem; }
  .app-nav a { display: flex; align-items: center; gap: 0.5625rem; padding: 0.5rem 0.625rem; border-radius: var(--radius-sm); color: var(--color-text-muted); text-decoration: none; font-size: 0.875rem; }
  .app-nav a.active { background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent-strong); font-weight: 600; }

  /* settings-inner 同时是尺寸容器（cq 单位基准），供工作区按 3:2 自适应 */
  .settings { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .settings-inner { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; padding: 1.5rem 5% 1.75rem; container-type: size; }
  /* 整体居中：标题/标签/面板同宽一列（宽=面板宽），该列在页面水平居中；
     列内部三者左缘仍是同一条竖线 */
  .page-head { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem; flex: none; width: min(100cqw, 150cqh); margin-inline: auto; }
  .page-head h1 { font-size: 1.375rem; margin: 0; }
  .proto-tag { font-size: 0.75rem; color: var(--color-accent-strong); background: color-mix(in srgb, var(--color-accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--color-accent) 35%, transparent); padding: 0.125rem 0.625rem; border-radius: var(--radius-pill); font-weight: 600; }
  .tabs { display: inline-flex; background: color-mix(in srgb, var(--color-text) 5%, transparent); border-radius: var(--radius-sm); padding: 0.1875rem; margin-bottom: 1.25rem; flex: none; width: min(100cqw, 150cqh); margin-inline: auto; }
  .tabs button { border: 0; background: transparent; padding: 0.375rem 1.125rem; font-size: 0.875rem; font-weight: 600; color: var(--color-text-muted); border-radius: 0.375rem; }
  .tabs button.active { background: var(--color-panel-soft); color: var(--color-accent-strong); box-shadow: var(--elevation-1); }

  /* ── 工作区：固定 3:2；宽 = min(容器宽, 高×1.5)；与标题/标签同列居中，列内左缘同一条竖线 ── */
  .workbench { flex: none; display: flex; gap: 0; align-items: stretch; aspect-ratio: 3 / 2; width: min(100cqw, 150cqh); margin-inline: auto; }
  .workbench.solo .card { border-radius: var(--radius-md); }

  /* 行为 / 外观内部排版严格沿用当前 ConfigPage.vue / ThemeSelector.vue；仅外层装入统一 3:2 面板 */
  .legacy-section { display: grid; gap: 1rem; padding: 1.25rem; }
  .legacy-section-title { margin: 0 0 0.25rem; font-size: 0.9375rem; font-weight: 650; color: var(--color-text); }
  .legacy-field { display: grid; gap: 0.5rem; }
  .legacy-field > span { color: var(--color-text-muted); font-size: 0.8125rem; }
  .legacy-field-hint { color: var(--color-text-muted); font-size: 0.75rem; line-height: 1.5; }
  .legacy-section select,
  .legacy-section input[type='text'],
  .legacy-section input[type='number'] { width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-panel-soft); color: var(--color-text); padding: 0.625rem 0.75rem; font-size: 0.8125rem; }
  .theme-selector { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: 0.75rem; }
  .palette-card { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 0.75rem; cursor: pointer; text-align: center; background: transparent; }
  .palette-card:hover { background: var(--color-panel-soft); }
  .palette-card.active { border-color: var(--color-accent); background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
  .palette-swatch { display: flex; gap: 0.25rem; justify-content: center; margin-bottom: 0.5rem; }
  .palette-swatch i { width: 1.25rem; height: 1.25rem; border-radius: var(--radius-xs); }
  .palette-name { color: var(--color-text); font-size: 0.8125rem; }

  .plist { width: 14.375rem; flex: none; display: flex; flex-direction: column; background: var(--color-panel-soft); border: 1px solid var(--color-border); border-right: 0; border-radius: var(--radius-md) 0 0 var(--radius-md); overflow: hidden; }
  .plist-head { padding: 0.875rem 1rem 0.5rem; display: flex; align-items: baseline; justify-content: space-between; flex: none; }
  .plist-head h2 { margin: 0; font-size: 0.9375rem; }
  .plist-head .count { font-size: 0.71875rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .plist-add { margin: 0 0.75rem 0.75rem; width: calc(100% - 1.5rem); display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; padding: 0.5rem; font-size: 0.8125rem; font-weight: 600; color: var(--color-accent-strong); background: color-mix(in srgb, var(--color-accent) 10%, transparent); border: 1px dashed color-mix(in srgb, var(--color-accent) 45%, transparent); border-radius: var(--radius-sm); transition: background var(--duration-fast) var(--ease-out); flex: none; }
  .plist-add:hover { background: color-mix(in srgb, var(--color-accent) 16%, transparent); }
  .plist-add.active { border-style: solid; background: color-mix(in srgb, var(--color-accent) 16%, transparent); }
  .plist-items { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: 0 0.5rem 0.625rem; gap: 0.125rem; }
  .pitem { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.5rem; width: 100%; text-align: left; border: 0; background: transparent; padding: 0.625rem; border-radius: var(--radius-sm); transition: background var(--duration-fast) var(--ease-out); }
  .pitem:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }
  .pitem.sel { background: color-mix(in srgb, var(--color-accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 38%, transparent); }
  .pitem:focus-visible, .btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .pitem .meta { min-width: 0; }
  .pitem .meta .name { font-size: 0.875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .meta .host { font-size: 0.71875rem; color: var(--color-text-muted); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .mcount { font-size: 0.6875rem; color: var(--color-text-muted); background: color-mix(in srgb, var(--color-text) 7%, transparent); padding: 0.125rem 0.4375rem; border-radius: var(--radius-pill); font-variant-numeric: tabular-nums; }
  .plist-empty { padding: 0.375rem 1rem 1rem; font-size: 0.78125rem; color: var(--color-text-muted); flex: none; }

  /* ── 详情框：与左栏紧挨（共享圆角另一半），内容区内部滚动 ── */
  .pdetail { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .card { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--color-panel-soft); border: 1px solid var(--color-border); border-radius: 0 var(--radius-md) var(--radius-md) 0; }
  .mscroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  .card-head { display: flex; align-items: center; gap: 0.625rem; padding: 1rem 1.25rem 0; flex-wrap: wrap; flex: none; }
  .card-head h3 { margin: 0; font-size: 1rem; }
  .card-head .spacer { flex: 1; }

  .d-head { padding: 1.125rem 1.25rem; display: flex; align-items: flex-start; gap: 0.875rem; flex: none; }
  .d-ava { width: 2.5rem; height: 2.5rem; flex: none; border-radius: var(--radius-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--color-accent) 15%, var(--color-panel)); color: var(--color-accent-strong); }
  .d-title { flex: 1; min-width: 0; }
  .d-title .row1 { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .d-title h2 { margin: 0; font-size: 1.0625rem; }
  .d-title .sub { margin-top: 0.1875rem; font-size: 0.8125rem; color: var(--color-text-muted); display: flex; gap: 0.875rem; flex-wrap: wrap; }
  .d-title .sub code { font-family: var(--font-mono); font-size: 0.75rem; }
  .d-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

  .mlist { display: flex; flex-direction: column; margin-top: 0.75rem; }
  .mrow { display: grid; grid-template-columns: 1fr auto auto auto auto; align-items: center; gap: 0.625rem; padding: 0.4375rem 1.25rem; border-top: 1px solid color-mix(in srgb, var(--color-border) 55%, transparent); }
  .mrow:hover { background: color-mix(in srgb, var(--color-text) 3%, transparent); }
  .mrow.enter { animation: row-in var(--duration-slow) var(--ease-spring); }
  @keyframes row-in { from { opacity: 0; transform: translateY(-0.375rem); } }
  .mtest { white-space: nowrap; min-width: 4.625rem; justify-content: center; }
  .mtest.ok { color: var(--color-success-strong); border-color: color-mix(in srgb, var(--color-success) 45%, transparent); background: color-mix(in srgb, var(--color-success) 8%, transparent); }
  .mtest.fail { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 45%, transparent); background: color-mix(in srgb, var(--color-danger) 7%, transparent); }
  .mrow .mid { font-family: var(--font-mono); font-size: 0.8125rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mid .nm { color: var(--color-text-muted); font-family: var(--font-sans); font-size: 0.75rem; margin-left: 0.5rem; }
  .tag { font-size: 0.6875rem; padding: 0.125rem 0.5rem; border-radius: var(--radius-pill); font-weight: 600; }
  .tag.queried { color: var(--color-info); background: color-mix(in srgb, var(--color-info) 10%, transparent); }
  .tag.manual { color: var(--color-text-muted); background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .mrow .mtok { font-size: 0.75rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .icon-btn { width: 1.875rem; height: 1.875rem; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-xs); color: var(--color-text-muted); }
  .icon-btn:hover { background: color-mix(in srgb, var(--color-danger) 9%, transparent); color: var(--color-danger); }
  .icon-btn.plain:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); color: var(--color-text); }
  .empty { padding: 1.625rem 1.25rem 1.875rem; text-align: center; color: var(--color-text-muted); font-size: 0.8125rem; }
  .empty b { color: var(--color-text); }
  .pool-note { padding: 0.625rem 1.25rem 0.875rem; border-top: 1px dashed var(--color-border); font-size: 0.71875rem; color: var(--color-text-muted); flex: none; }

  /* ── 查询模型组合框 ── */
  .cbx { position: relative; }
  .dd { position: absolute; top: calc(100% + 0.375rem); right: 0; width: 28.75rem; max-width: calc(100vw - 5.625rem); z-index: 60; background: var(--color-panel-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--elevation-2); animation: dd-in var(--duration-base) var(--ease-out); overflow: hidden; }
  @keyframes dd-in { from { opacity: 0; transform: translateY(-0.3125rem); } }
  .cbx-head { display: flex; gap: 0.5rem; padding: 0.625rem; border-bottom: 1px solid var(--color-border); align-items: center; }
  .searchbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-panel); padding: 0 0.625rem; color: var(--color-text-muted); }
  .searchbox:focus-within { border-color: var(--color-accent); }
  .searchbox input { flex: 1; border: 0; background: transparent; padding: 0.375rem 0; font-size: 0.8125rem; outline: none; font-family: var(--font-mono); min-width: 0; }
  .dd-list { max-height: 18.75rem; overflow: auto; }
  .qrow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 0.75rem; width: 100%; padding: 0.5rem 0.875rem; border: 0; background: transparent; text-align: left; transition: background var(--duration-fast) var(--ease-out); }
  .qrow + .qrow { border-top: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent); }
  .qrow:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 9%, transparent); }
  .qrow:disabled { opacity: 0.55; cursor: default; }
  .qrow .qid { font-family: var(--font-mono); font-size: 0.8125rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .qid .nm { color: var(--color-text-muted); font-family: var(--font-sans); font-size: 0.71875rem; margin-left: 0.5rem; }
  .qrow .mtok { font-size: 0.71875rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .qrow .qadd { font-size: 0.71875rem; font-weight: 700; color: var(--color-accent-strong); white-space: nowrap; }
  .qrow .qok { font-size: 0.71875rem; font-weight: 700; color: var(--color-success-strong); display: inline-flex; gap: 0.25rem; align-items: center; white-space: nowrap; }
  .spinner { width: 0.875rem; height: 0.875rem; border: 2px solid color-mix(in srgb, var(--color-accent) 30%, transparent); border-top-color: var(--color-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skel { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem 0.875rem; }
  .skel .bar { height: 2.125rem; border-radius: var(--radius-xs); background: linear-gradient(90deg, color-mix(in srgb, var(--color-text) 6%, transparent) 25%, color-mix(in srgb, var(--color-text) 10%, transparent) 50%, color-mix(in srgb, var(--color-text) 6%, transparent) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .dd-note { padding: 0.625rem 0.875rem 0.75rem; font-size: 0.75rem; color: var(--color-text-muted); }

  .btn { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.4375rem 0.8125rem; font-size: 0.8125rem; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-panel-soft); color: var(--color-text); transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast); }
  .btn:hover { border-color: var(--color-border-strong); background: color-mix(in srgb, var(--color-text) 4%, var(--color-panel-soft)); }
  .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
  .btn.primary:hover { background: var(--color-accent-strong); border-color: var(--color-accent-strong); }
  .btn.ghost-danger { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 35%, transparent); background: transparent; }
  .btn.ghost-danger:hover { background: color-mix(in srgb, var(--color-danger) 8%, transparent); }
  .btn.sm { padding: 0.3125rem 0.625rem; font-size: 0.75rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }

  /* 新建表单（与详情框合并） */
  .pform { padding: 1rem 1.25rem 1.125rem; display: flex; flex-direction: column; gap: 0.625rem; border-top: 1px solid var(--color-border); }
  .pform .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
  .pform label { display: grid; gap: 0.25rem; font-size: 0.75rem; color: var(--color-text-muted); }
  .pform input { border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-panel-soft); padding: 0.375rem 0.625rem; font-size: 0.8125rem; }
  .req::after { content: " *"; color: var(--color-danger); }
  .frow { display: flex; gap: 0.5rem; justify-content: flex-end; }

  .toast-wrap { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 0.5rem; z-index: 1000; align-items: center; }
  .toast { display: flex; align-items: center; gap: 0.625rem; background: var(--color-text); color: #FCFAF5; font-size: 0.8125rem; padding: 0.5625rem 0.75rem 0.5625rem 1rem; border-radius: var(--radius-md); box-shadow: var(--elevation-3); animation: t-in var(--duration-slow) var(--ease-spring); }
  .toast.out { animation: t-out var(--duration-base) var(--ease-out) forwards; }
  @keyframes t-in { from { opacity: 0; transform: translateY(0.75rem); } }
  @keyframes t-out { to { opacity: 0; transform: translateY(0.5rem); } }
  .toast button { border: 0; background: color-mix(in srgb, #FCFAF5 14%, transparent); color: #FCFAF5; font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.625rem; border-radius: var(--radius-xs); }

  .scrim { position: fixed; inset: 0; background: rgba(59,61,63,0.4); backdrop-filter: blur(2px); display: none; place-items: center; z-index: 900; }
  .scrim.show { display: grid; }
  .dialog { width: 25rem; background: var(--color-panel-soft); border-radius: var(--radius-lg); box-shadow: var(--elevation-3); padding: 1.375rem 1.5rem; animation: t-in var(--duration-slow) var(--ease-spring); }
  .dialog h3 { margin: 0 0 0.5rem; font-size: 1rem; }
  .dialog p { margin: 0 0 1.125rem; font-size: 0.8125rem; color: var(--color-text-muted); }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" aria-label="主导航">
    <div class="app-brand">Claude Link</div>

  undo: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
};
const AVAILABLE = {
  p1: [['glm-4.7','GLM-4.7 旗舰',98304],['glm-4.7-air','GLM-4.7 Air 轻量',65536],['glm-4.6','GLM-4.6',98304],['glm-4.5-air','GLM-4.5 Air',65536],['glm-4.5-flash','GLM-4.5 Flash 免费',32768],['glm-4v-plus','GLM-4V Plus 视觉',16384],['glm-4-long','GLM-4 Long 长文本',1048576],['glm-4-flashx','GLM-4 FlashX',32768],['glm-4-air-250414','GLM-4 Air 250414',65536],['glm-4-plus','GLM-4 Plus',98304],['codegeex-4','CodeGeeX-4 编程',32768],['glm-zero-preview','GLM Zero Preview',32768]],
  p2: [['claude-opus-4-6','Claude Opus 4.6',32768],['claude-sonnet-4-6','Claude Sonnet 4.6',65536],['claude-sonnet-4-5','Claude Sonnet 4.5',65536],['claude-haiku-4-5','Claude Haiku 4.5',32768],['claude-3-7-sonnet','Claude 3.7 Sonnet',65536],['claude-3-5-haiku','Claude 3.5 Haiku',8192]],
  p3: [['claude-opus-4-6','Claude Opus 4.6',32768],['claude-sonnet-4-6','Claude Sonnet 4.6',65536],['claude-sonnet-4-5','Claude Sonnet 4.5',65536],['gpt-5.2','GPT-5.2（兼容层）',131072],['gemini-3-pro','Gemini 3 Pro（兼容层）',1048576],['deepseek-v3.2','DeepSeek V3.2（兼容层）',131072],['kimi-k2.5','Kimi K2.5（兼容层）',262144]],
};
function m(id, name, tok, src) { return { id, name, tok, src, addedAt: Date.now() }; }
/* 设置只维护可选库，无 active/def 选用语义（选用在会话内） */
let providers = [
  { id: 'p1', name: '智谱 GLM', note: '主力，性价比', url: 'https://open.bigmodel.cn/api/anthropic', key: '9f2c',
    models: [m('glm-4.7','GLM-4.7 旗舰',98304,'queried'), m('glm-4.7-air','GLM-4.7 Air 轻量',65536,'queried'), m('glm-4.6','GLM-4.6',98304,'queried')] },
  { id: 'p2', name: 'Anthropic 官方', note: '', url: 'https://api.anthropic.com', key: 'a41b',
    models: [m('claude-sonnet-4-6','Claude Sonnet 4.6',65536,'queried'), m('claude-opus-4-6','Claude Opus 4.6',32768,'queried'), m('claude-haiku-4-5','Claude Haiku 4.5',32768,'queried')] },
  { id: 'p3', name: 'sub2api 中转', note: '备用线路', url: 'https://sub2api.example.com', key: '77e0',
    models: [m('claude-sonnet-4-6','Claude Sonnet 4.6',65536,'manual')] },
];
const queried = {}, queryState = {};
let selId = 'p1', qFilter = '';
let creating = false; // 新建供应商模式：详情框切换为表单
let cbxOpen = false;  // 查询模型下拉是否展开

const $ = (s) => document.querySelector(s);
const host = (u) => { try { return new URL(u).host; } catch { return u; } };
const cur = () => providers.find(p => p.id === selId);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${msg}</span>` + (action ? `<button type="button">${ICON.undo}${action.label}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { action.fn(); kill(); };
  $('#toasts').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  setTimeout(kill, action ? 5000 : 2600);
}
function confirmDlg({ title, body, okText, onOk }) {
  const scrim = $('#scrim'), box = $('#dialogBox');
  box.innerHTML = `<h3>${title}</h3><p>${body}</p><div class="frow"><button class="btn" data-x>取消</button><button class="btn danger" data-ok>${okText}</button></div>`;
  scrim.classList.add('show');
  box.querySelector('[data-x]').onclick = () => scrim.classList.remove('show');
  box.querySelector('[data-ok]').onclick = () => { scrim.classList.remove('show'); onOk(); };
  scrim.onclick = (e) => { if (e.target === scrim) scrim.classList.remove('show'); };
}

/* ── 左侧供应商列表栏 ── */
function renderList() {
  $('#pCount').textContent = `${providers.length} 个`;
  $('#btnNew').classList.toggle('active', creating);
  $('#pItems').innerHTML = providers.map(p => `
    <button type="button" class="pitem ${p.id === selId && !creating ? 'sel' : ''}" data-pid="${p.id}" aria-current="${p.id === selId && !creating}">
      <span class="meta">
        <span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
        <span class="host" title="${esc(p.url)}">${esc(host(p.url))}</span>
      </span>
      <span class="mcount">${p.models.length} 模型</span>
    </button>`).join('');
  $('#pEmpty').hidden = providers.length > 0;
  document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
    selId = b.dataset.pid; qFilter = ''; creating = false; cbxOpen = false;
    render();
  });
}

/* ── 详情框：查看 / 新建表单 ── */
function renderDetail() {
  if (creating) { renderCreateForm(); return; }
  const p = cur();
  if (!p) {
    $('#pDetail').innerHTML = `<div class="card"><div class="empty">还没有供应商。点左侧<b>「新建供应商」</b>开始。</div></div>`;
    return;
  }
  $('#pDetail').innerHTML = `
    <div class="card">
      <div class="d-head">
        <div class="d-ava">${ICON.server}</div>
        <div class="d-title">
          <div class="row1"><h2>${esc(p.name)}</h2></div>
          <div class="sub">
            <span>地址 <code>${esc(p.url)}</code></span>
            <span>Key <code>sk-…****${esc(p.key)}</code></span>
            ${p.note ? `<span>备注 ${esc(p.note)}</span>` : ''}
          </div>
        </div>
        <div class="d-actions">
          <button class="btn" id="aTest">${ICON.zap}测试连接</button>
          <button class="btn ghost-danger" id="aDel" aria-label="删除供应商">${ICON.trash}删除</button>
        </div>
      </div>
      <div class="card-head">
        <h3>我的模型</h3>
        <span style="font-size:.75rem;color:var(--color-text-muted)">${p.models.length} 个</span>
        <div class="spacer"></div>
        <div class="cbx" id="cbx">
          <button class="btn primary" id="cbxBtn" aria-haspopup="listbox" aria-expanded="${cbxOpen}">${ICON.search}查询模型${ICON.chev}</button>
          ${cbxOpen ? renderCbx(p) : ''}
        </div>
      </div>
      <div class="mscroll">${renderMyModels(p)}</div>
      <div class="pool-note">设置页只维护可选的供应商与模型；会话中可自由选用任意供应商 / 模型。</div>
    </div>`;

  $('#aTest').onclick = () => toast('已发起连接测试（复用现有测试连接弹窗）');
  $('#aDel').onclick = () => confirmDlg({
    title: `删除供应商「${esc(p.name)}」？`,
    body: `将同时删除其 ${p.models.length} 个模型配置。正在使用它的会话不受影响，但无法再新建选用。删除后可撤销。`,
    okText: '删除',
    onOk: () => {
      const i = providers.indexOf(p), snap = p;
      providers.splice(i, 1);
      if (selId === p.id) selId = providers[0]?.id || null;
      render();
      toast(`已删除供应商「${esc(p.name)}」`, { label: '撤销', fn: () => { providers.splice(i, 0, snap); selId = snap.id; render(); } });
    },
  });
  bindMyModels(p);
  bindCbx(p);
}

/* ── 新建供应商：表单渲染在与详情同一个框里 ── */
function renderCreateForm() {
  $('#pDetail').innerHTML = `
    <div class="card">
      <div class="d-head">
        <div class="d-ava">${ICON.plus.replace('width="13"', 'width="18"').replace('height="13"', 'height="18"')}</div>
        <div class="d-title">
          <div class="row1"><h2>新建供应商</h2></div>
          <div class="sub"><span>创建后点「查询模型」即可从端点拉取并添加模型</span></div>
        </div>
      </div>
      <div class="pform">
        <div class="grid2">
          <label class="req">名称<input id="fName" placeholder="例如：DeepSeek 官方" /></label>
          <label class="req">请求地址（Base URL）<input id="fUrl" placeholder="https://api.deepseek.com/anthropic" /></label>
        </div>
        <label>API Key<input id="fKey" type="password" placeholder="sk-…" /></label>
        <div class="frow"><button class="btn" id="fCancel">取消</button><button class="btn primary" id="fSave">创建供应商</button></div>
      </div>
    </div>`;
  $('#fCancel').onclick = () => { creating = false; render(); };
  $('#fSave').onclick = () => {
    const name = $('#fName').value.trim(), url = $('#fUrl').value.trim(), key = $('#fKey').value.trim();
    if (!name || !url) { toast('名称和请求地址为必填'); return; }
    const id = 'p' + (Date.now() % 100000);
    AVAILABLE[id] = [];
    providers.push({ id, name, note: '', url, key: key ? key.slice(-4) : '未设', models: [] });
    selId = id; qFilter = ''; creating = false; cbxOpen = false;
    render();
    toast(`已创建供应商「${esc(name)}」，点「查询模型」开始添加模型`);
  };
  setTimeout(() => $('#fName')?.focus(), 30);
}

function renderMyModels(p) {
  if (!p.models.length) {
    return `<div class="empty">还没有模型。点右上角 <b>「查询模型」</b>从端点拉取并点击添加，<br>或在下拉框中手动输入模型 ID 后点「确认」。</div>`;
  }
  const rows = p.models.map(mm => `
    <div class="mrow" data-mid="${esc(mm.id)}">
      <span class="mid" title="${esc(mm.id)}">${esc(mm.id)}<span class="nm">${esc(mm.name)}</span></span>
      <span class="mtok">${mm.tok ? (mm.tok / 1024 | 0) + 'k tok' : '—'}</span>
      <span class="tag ${mm.src}">${mm.src === 'queried' ? '查询' : '手动'}</span>
      <button type="button" class="btn sm mtest" data-testmid="${esc(mm.id)}" aria-label="用模型 ${esc(mm.id)} 测试连接">${ICON.zap}测试</button>
      <button type="button" class="icon-btn" data-del="${esc(mm.id)}" aria-label="删除模型 ${esc(mm.id)}" title="删除">${ICON.trash}</button>
    </div>`).join('');
  return `<div class="mlist">${rows}</div>`;
}

function bindMyModels(p) {
  /* 单模型测试连接：加载态（按钮内 spinner）→ 通过/失败态 + toast */
  document.querySelectorAll('[data-testmid]').forEach(b => b.onclick = () => {
    const id = b.dataset.testmid;
    b.disabled = true;
    b.classList.remove('ok', 'fail');
    b.innerHTML = '<span class="spinner"></span>测试中';
    setTimeout(() => {
      const ok = !id.includes('bad'); // mock：id 含 "bad" 演示失败态
      b.innerHTML = ok ? `${ICON.check}通过` : `${ICON.x}失败`;
      b.classList.add(ok ? 'ok' : 'fail');
      b.disabled = false;
      toast(ok
        ? `模型 <b>${esc(id)}</b> 连接测试通过`
        : `模型 <b>${esc(id)}</b> 连接失败：404 model not found（网关不支持该模型）`, null);
    }, 1200);
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const id = b.dataset.del;
    const idx = p.models.findIndex(x => x.id === id);
    const removed = p.models.splice(idx, 1)[0];
    render();
    toast(`已删除模型 ${esc(id)}`, { label: '撤销', fn: () => { p.models.splice(idx, 0, removed); render(); } });
  });
}

/* ── 查询模型组合框：点击即添加 / 手动输入 + 确认 ── */
function renderCbx(p) {
  const st = queryState[p.id] || 'idle';
  let bodyHtml = '';
  if (st === 'loading') {
    bodyHtml = `<div class="skel"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`;
  } else if (st === 'idle') {
    bodyHtml = `<div class="dd-note">正在从 ${esc(host(p.url))}/v1/models 拉取…</div>`;
  } else {
    bodyHtml = `<div class="dd-list">${renderQRowsHtml(p, qFilter)}</div>`;
  }
  return `<div class="dd cbx-dd">
    <div class="cbx-head">
      <div class="searchbox">${ICON.search}<input id="ddInput" placeholder="搜索模型，或输入自定义模型 ID" value="${esc(qFilter)}" autocomplete="off" spellcheck="false" /></div>
      <button class="btn sm primary" id="ddConfirm">确认</button>
      <button class="icon-btn plain" id="ddRefresh" title="重新查询" aria-label="重新查询">${ICON.refresh}</button>
    </div>
    ${bodyHtml}
  </div>`;
}
function renderQRowsHtml(p, filterRaw) {
  const filter = (filterRaw || '').toLowerCase();
  const list = (queried[p.id] || []).filter(x => x.id.toLowerCase().includes(filter) || x.name.toLowerCase().includes(filter));
  const addedSet = new Set(p.models.map(x => x.id));
  if (!list.length) return `<div class="dd-note">列表中没有「${esc(filterRaw)}」。<br>如果这是网关自定义模型，直接点右侧「确认」手动添加。</div>`;
  return list.map(x => {
    const added = addedSet.has(x.id);
    return `<button type="button" class="qrow" data-qid="${esc(x.id)}" ${added ? 'disabled' : ''}>
      <span class="qid" title="${esc(x.id)}">${esc(x.id)}<span class="nm">${esc(x.name)}</span></span>
      <span class="mtok">${x.tok ? (x.tok / 1024 | 0) + 'k' : '—'}</span>
      ${added ? `<span class="qok">${ICON.check}已添加</span>` : `<span class="qadd">＋ 点击添加</span>`}
    </button>`;
  }).join('');
}

function bindCbx(p) {
  const btn = $('#cbxBtn');
  if (!btn) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    cbxOpen = !cbxOpen;
    if (cbxOpen && (queryState[p.id] || 'idle') === 'idle') runQuery(p);
    renderDetail();
    if (cbxOpen) setTimeout(() => $('#ddInput')?.focus(), 30);
  };
  if (!cbxOpen) return;
  const input = $('#ddInput');
  if (input) {
    input.oninput = () => { qFilter = input.value; refreshCbxList(); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); manualAdd(p); }
      if (e.key === 'Escape') { cbxOpen = false; qFilter = ''; renderDetail(); }
    };
  }
  $('#ddConfirm').onclick = () => manualAdd(p);
  $('#ddRefresh').onclick = () => runQuery(p);
  bindCbxRows(p);
}
function bindCbxRows(p) {
  document.querySelectorAll('.qrow:not(:disabled)').forEach(r => r.onclick = (e) => {
    e.stopPropagation();
    const info = (queried[p.id] || []).find(x => x.id === r.dataset.qid);
    p.models.push(m(info.id, info.name, info.tok, 'queried'));
    renderDetail();
    toast(`已添加 <b>${esc(info.id)}</b> 到「${esc(p.name)}」`);
    setTimeout(() => $('#ddInput')?.focus(), 30);
  });
}
/* 只刷新下拉列表区：输入过滤时输入框节点不动（IME 安全） */
function refreshCbxList() {
  const p = cur();
  const dd = $('.cbx-dd');
  if (!dd || (queryState[p.id] || 'idle') !== 'done') return;
  dd.querySelector('.dd-list').innerHTML = renderQRowsHtml(p, qFilter);
  bindCbxRows(p);
}
function manualAdd(p) {
  const input = $('#ddInput');
  const id = (input?.value || '').trim();
  if (!id) { toast('请输入模型 ID'); input?.focus(); return; }
  if (p.models.some(x => x.id === id)) { toast(`「${esc(id)}」已在列表中，不可重复添加`); input?.focus(); return; }
  p.models.push(m(id, id, 0, 'manual'));
  renderDetail();
  toast(`已手动添加模型 <b>${esc(id)}</b>`);
  setTimeout(() => $('#ddInput')?.focus(), 30);
}
function runQuery(p) {
  queryState[p.id] = 'loading';
  renderDetail();
  setTimeout(() => {
    queried[p.id] = (AVAILABLE[p.id] || []).map(([id, name, tok]) => ({ id, name, tok }));
    queryState[p.id] = 'done';
    if (selId === p.id && cbxOpen && !creating) { renderDetail(); setTimeout(() => $('#ddInput')?.focus(), 30); }
  }, 900);
}

/* 点外部/ESC 关闭查询下拉 */
document.addEventListener('click', (e) => {
  if (cbxOpen && !e.target.closest('#cbx')) { cbxOpen = false; qFilter = ''; renderDetail(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cbxOpen) { cbxOpen = false; qFilter = ''; renderDetail(); }
});

/* ── 新建供应商（入口在左侧列表栏顶部，再点一次收起表单） ── */
$('#btnNew').onclick = () => { creating = !creating; cbxOpen = false; render(); if (creating) setTimeout(() => $('#fName')?.focus(), 30); };

/* ── 标签页切换：连接/行为/外观共用同一 3:2 面板，风格统一 ── */
let activeTab = 'connection';
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { activeTab = b.dataset.tab; render(); });

function renderTabBody() {
  if (activeTab === 'behavior') {
    /* 内部结构/字段顺序/提示文案按当前 ConfigPage.vue 原样保留 */
    $('#tabBody').innerHTML = `
      <div class="card">
        <div class="mscroll"><div class="legacy-section">
          <h3 class="legacy-section-title">行为</h3>
          <label class="legacy-field">
            <span>最大轮次 <small class="legacy-field-hint">对应 Claude Code <code>--max-turns</code>：限制单次会话的最大工具调用轮数。</small></span>
            <input type="number" value="200" min="1" />
          </label>
          <label class="legacy-field">
            <span>队列任务间隔（秒） <small class="legacy-field-hint">Claude Link 自身功能：任务队列里两条任务之间的等待时间。<strong>非</strong> Claude Code 配置。</small></span>
            <input type="number" value="5" min="0" />
          </label>
          <label class="legacy-field">
            <span>默认思考强度 <small class="legacy-field-hint">新会话与未单独设档的会话回落到此值。低=快速响应、高=深入分析、超高/极限=最强推理；「工作流」档为 xhigh + 动态工作流编排（Beta，成本最高）。也可在<strong>会话内</strong>按需单独调整。</small></span>
            <select>
              <option value="low">低（快速响应）</option>
              <option value="medium" selected>中（平衡，默认）</option>
              <option value="high">高（深入分析）</option>
              <option value="xhigh">超高（复杂推理）</option>
              <option value="max">极限（最高强度，成本最高）</option>
              <option value="ultracode">工作流（xhigh + 动态工作流，Beta）</option>
            </select>
          </label>
          <p class="legacy-field-hint">权限模式（default / acceptEdits / plan / bypassPermissions）已改为在<strong>会话内</strong>按需调整，不再放在这里。</p>
        </div></div>
      </div>`;
  } else if (activeTab === 'appearance') {
    /* ThemeSelector.vue 的卡片网格与字号字段按当前实现原样保留 */
    const palettes = [
      ['暖纸','#F8F4ED','#F4F0EA','#537D96','#3B3D3F'],
      ['草香','#F5F8F3','#EFF3EC','#5BA88C','#2E3832'],
      ['珊瑚','#FDF6EC','#FCF1E4','#1A3049','#1A3049'],
      ['沉思','#F3F5F7','#ECEFF2','#7E99A8','#2C3238'],
      ['绝对','#F4F3EE','#EDEAE2','#B5846E','#2D2B28'],
      ['素白','#FAF8F7','#F3F1F0','#3A6B85','#1A1C1E'],
      ['深思','#FCFCFD','#F0F0F2','#636AE8','#1D1D1F'],
      ['纯白','#FFFFFF','#F0F0F0','#1A1A1A','#1A1A1A'],
      ['新暖纸','#F5EFE4','#EFE8DB','#537D96','#2A2622'],
    ];
    $('#tabBody').innerHTML = `
      <div class="card">
        <div class="mscroll"><div class="legacy-section">
          <h3 class="legacy-section-title">外观</h3>
          <div class="theme-selector">
            ${palettes.map((p, i) => `<div class="palette-card ${i === 0 ? 'active' : ''}" tabindex="0">
              <div class="palette-swatch"><i style="background:${p[1]}"></i><i style="background:${p[2]}"></i><i style="background:${p[3]}"></i><i style="background:${p[4]}"></i></div>
              <span class="palette-name">${p[0]}</span>
            </div>`).join('')}
          </div>
          <label class="legacy-field">
            <span>字号 <small class="legacy-field-hint">小/中/大三档，全局缩放所有文字与间距</small></span>
            <select id="fontScaleSel">
              <option value="small">小</option>
              <option value="medium" selected>中</option>
              <option value="large">大</option>
            </select>
          </label>
        </div></div>
      </div>`;
    $('#tabBody').querySelectorAll('.palette-card').forEach(s => s.onclick = () => {
      $('#tabBody').querySelectorAll('.palette-card').forEach(x => x.classList.remove('active'));
      s.classList.add('active');
    });
  }
}

function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  const solo = activeTab !== 'connection';
  $('#workbench').classList.toggle('solo', solo);
  $('#plistBox').hidden = solo;
  $('#pDetail').hidden = solo;
  $('#tabBody').hidden = !solo;
  if (solo) renderTabBody();
  else { renderList(); renderDetail(); }
}
render();
</script>
</body>
</html>
