<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多供应商 × 模型管理 · V1-r2b 供应商标签条</title>
<!--
  多供应商模型管理 — V1 定版迭代 r2b（去左栏 + 统一「查询模型」下拉）
  ══════════════════════════════════════════════════════════════
  · 与 r2a 交互完全一致（查询模型组合框：下拉点击即添加 / 下拉内手动
    输入 + 「确认」按钮在拉框内），唯一差异是供应商切换形式：
      r2a = 顶部下拉选择器（紧凑，供应商多时不挤）
      r2b = 顶部横向供应商标签条 + 「新建」（本版，一排全看见）
  · 视觉：与主应用同源 token（warm-paper）。
  · 历史版本：v1（双栏主从原版）/ v2（折叠卡片）/ v3（弹窗模型库）。
-->
<style>
  :root {
    color-scheme: light;
    --color-bg: #F8F4ED; --color-panel: #F4F0EA; --color-panel-soft: #FCFAF5;
    --color-border: rgba(122, 96, 88, 0.18); --color-border-strong: rgba(0, 0, 0, 0.12);
    --color-text: #3B3D3F; --color-text-muted: #6A6C70;
    --color-accent: #537D96; --color-accent-strong: #456A80; --color-on-accent: #FFFFFF;
    --color-danger: #8B3A3A; --color-success: #4A9E5E; --color-success-strong: #2E7D46; --color-info: #3B7DD8;
    --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-pill: 999px;
    --elevation-1: 0 1px 2px rgba(0,0,0,0.06);
    --elevation-2: 0 4px 12px rgba(0,0,0,0.08);
    --elevation-3: 0 12px 32px rgba(0,0,0,0.12);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --duration-fast: 120ms; --duration-base: 200ms; --duration-slow: 320ms;
    --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
    --sidebar-width: 200px;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --duration-fast: 1ms; --duration-base: 1ms; --duration-slow: 1ms; --ease-spring: var(--ease-out); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-sans); font-size: 16px; line-height: 1.5; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; }
  svg { flex: none; }
  [hidden] { display: none !important; }

  .app { display: flex; height: 100vh; }
  .app-nav { width: var(--sidebar-width); flex: none; background: var(--color-panel); border-right: 1px solid var(--color-border-strong); padding: 14px 10px; }
  .app-brand { font-weight: 700; font-size: 0.9rem; padding: 6px 10px 14px; }
  .app-nav a { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-sm); color: var(--color-text-muted); text-decoration: none; font-size: 0.875rem; }
  .app-nav a.active { background: color-mix(in srgb, var(--color-accent) 14%, transparent); color: var(--color-accent-strong); font-weight: 600; }

  .settings { flex: 1; min-width: 0; overflow: auto; }
  .settings-inner { max-width: 860px; margin: 0 auto; padding: 28px 32px 60px; }
  .page-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .page-head h1 { font-size: 1.375rem; margin: 0; }
  .proto-tag { font-size: 0.75rem; color: var(--color-accent-strong); background: color-mix(in srgb, var(--color-accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--color-accent) 35%, transparent); padding: 2px 10px; border-radius: var(--radius-pill); font-weight: 600; }
  .tabs { display: inline-flex; background: color-mix(in srgb, var(--color-text) 5%, transparent); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 22px; }
  .tabs button { border: 0; background: transparent; padding: 6px 18px; font-size: 0.875rem; font-weight: 600; color: var(--color-text-muted); border-radius: 6px; }
  .tabs button.active { background: var(--color-panel-soft); color: var(--color-accent-strong); box-shadow: var(--elevation-1); }

  /* ── 供应商切换（本版变量：横向标签条 pill） ── */
  .pills-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--color-border); background: var(--color-panel-soft); border-radius: var(--radius-pill); padding: 6px 14px; font-size: 0.8125rem; font-weight: 600; color: var(--color-text-muted); transition: border-color var(--duration-fast) var(--ease-out), background var(--duration-fast) var(--ease-out); }
  .pill:hover { border-color: color-mix(in srgb, var(--color-accent) 45%, transparent); }
  .pill.sel { background: color-mix(in srgb, var(--color-accent) 13%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 38%, transparent); color: var(--color-accent-strong); }
  .pill:focus-visible, .btn:focus-visible, .icon-btn:focus-visible, .mrow-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-border-strong); }
  .pill.on .dot { background: var(--color-success); box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--color-success) 20%, transparent); }
  .pill .cnt { font-size: 0.6875rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; background: color-mix(in srgb, var(--color-text) 7%, transparent); padding: 1px 7px; border-radius: var(--radius-pill); }
  .pill.sel .cnt { background: color-mix(in srgb, var(--color-accent) 16%, transparent); color: var(--color-accent-strong); }
  .pill-add { color: var(--color-accent-strong); border-style: dashed; border-color: color-mix(in srgb, var(--color-accent) 45%, transparent); background: color-mix(in srgb, var(--color-accent) 6%, transparent); }
  .pill-add:hover { background: color-mix(in srgb, var(--color-accent) 13%, transparent); }

  /* ── 下拉浮层（查询模型组合框） ── */
  .dd { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60; background: var(--color-panel-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--elevation-2); animation: dd-in var(--duration-base) var(--ease-out); overflow: hidden; }
  @keyframes dd-in { from { opacity: 0; transform: translateY(-5px); } }
  .badge-on { font-size: 0.625rem; font-weight: 700; color: var(--color-success-strong); background: color-mix(in srgb, var(--color-success) 14%, transparent); padding: 1px 6px; border-radius: var(--radius-xs); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; font-size: 0.8125rem; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background: var(--color-panel-soft); color: var(--color-text); transition: background var(--duration-fast) var(--ease-out), border-color var(--duration-fast); }
  .btn:hover { border-color: var(--color-border-strong); background: color-mix(in srgb, var(--color-text) 4%, var(--color-panel-soft)); }
  .btn.primary { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
  .btn.primary:hover { background: var(--color-accent-strong); border-color: var(--color-accent-strong); }
  .btn.ghost-danger { color: var(--color-danger); border-color: color-mix(in srgb, var(--color-danger) 35%, transparent); background: transparent; }
  .btn.ghost-danger:hover { background: color-mix(in srgb, var(--color-danger) 8%, transparent); }
  .btn.sm { padding: 5px 10px; font-size: 0.75rem; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.danger { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }

  /* ── 详情卡 ── */
  .pdetail { display: flex; flex-direction: column; gap: 18px; }
  .card { background: var(--color-panel-soft); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px 0; flex-wrap: wrap; }
  .card-head h3 { margin: 0; font-size: 1rem; }
  .card-head .spacer { flex: 1; }

  .d-head { padding: 18px 20px; display: flex; align-items: flex-start; gap: 14px; }
  .d-ava { width: 40px; height: 40px; flex: none; border-radius: var(--radius-sm); display: grid; place-items: center; background: color-mix(in srgb, var(--color-accent) 15%, var(--color-panel)); color: var(--color-accent-strong); }
  .d-title { flex: 1; min-width: 0; }
  .d-title .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .d-title h2 { margin: 0; font-size: 1.0625rem; }
  .d-title .sub { margin-top: 3px; font-size: 0.8125rem; color: var(--color-text-muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .d-title .sub code { font-family: var(--font-mono); font-size: 0.75rem; }
  .d-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .mlist { display: flex; flex-direction: column; margin-top: 12px; }
  .mrow { display: grid; grid-template-columns: 26px 1fr auto auto auto; align-items: center; gap: 10px; padding: 9px 20px; border-top: 1px solid color-mix(in srgb, var(--color-border) 55%, transparent); }
  .mrow:hover { background: color-mix(in srgb, var(--color-text) 3%, transparent); }
  .mrow.enter { animation: row-in var(--duration-slow) var(--ease-spring); }
  @keyframes row-in { from { opacity: 0; transform: translateY(-6px); } }
  .mrow .mid { font-family: var(--font-mono); font-size: 0.8125rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .mid .nm { color: var(--color-text-muted); font-family: var(--font-sans); font-size: 0.75rem; margin-left: 8px; }
  .tag { font-size: 0.6875rem; padding: 2px 8px; border-radius: var(--radius-pill); font-weight: 600; }
  .tag.queried { color: var(--color-info); background: color-mix(in srgb, var(--color-info) 10%, transparent); }
  .tag.manual { color: var(--color-text-muted); background: color-mix(in srgb, var(--color-text) 7%, transparent); }
  .tag.def { color: var(--color-success-strong); background: color-mix(in srgb, var(--color-success) 13%, transparent); }
  .mrow .mtok { font-size: 0.75rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .radio { appearance: none; width: 16px; height: 16px; border: 1.5px solid var(--color-border-strong); border-radius: 50%; background: var(--color-panel-soft); cursor: pointer; }
  .radio:checked { border-width: 4.5px; border-color: var(--color-accent); }
  .icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: var(--radius-xs); color: var(--color-text-muted); }
  .icon-btn:hover { background: color-mix(in srgb, var(--color-danger) 9%, transparent); color: var(--color-danger); }
  .icon-btn.plain:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); color: var(--color-text); }
  .empty { padding: 26px 20px 30px; text-align: center; color: var(--color-text-muted); font-size: 0.8125rem; }
  .empty b { color: var(--color-text); }

  /* ── 查询模型组合框（本版核心交互） ── */
  .cbx { position: relative; }
  .cbx-dd { top: calc(100% + 6px); width: 460px; max-width: calc(100vw - 90px); }
  .cbx-head { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--color-border); align-items: center; }
  .searchbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-panel); padding: 0 10px; color: var(--color-text-muted); }
  .searchbox:focus-within { border-color: var(--color-accent); }
  .searchbox input { flex: 1; border: 0; background: transparent; padding: 6px 0; font-size: 0.8125rem; outline: none; font-family: var(--font-mono); min-width: 0; }
  .dd-list { max-height: 300px; overflow: auto; }
  .qrow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 12px; width: 100%; padding: 8px 14px; border: 0; background: transparent; text-align: left; transition: background var(--duration-fast) var(--ease-out); }
  .qrow + .qrow { border-top: 1px solid color-mix(in srgb, var(--color-border) 40%, transparent); }
  .qrow:hover:not(:disabled) { background: color-mix(in srgb, var(--color-accent) 9%, transparent); }
  .qrow:disabled { opacity: 0.55; cursor: default; }
  .qrow .qid { font-family: var(--font-mono); font-size: 0.8125rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow .qid .nm { color: var(--color-text-muted); font-family: var(--font-sans); font-size: 0.71875rem; margin-left: 8px; }
  .qrow .mtok { font-size: 0.71875rem; color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
  .qrow .qadd { font-size: 0.71875rem; font-weight: 700; color: var(--color-accent-strong); white-space: nowrap; }
  .qrow .qok { font-size: 0.71875rem; font-weight: 700; color: var(--color-success-strong); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  .spinner { width: 14px; height: 14px; border: 2px solid color-mix(in srgb, var(--color-accent) 30%, transparent); border-top-color: var(--color-accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .skel { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; }
  .skel .bar { height: 34px; border-radius: var(--radius-xs); background: linear-gradient(90deg, color-mix(in srgb, var(--color-text) 6%, transparent) 25%, color-mix(in srgb, var(--color-text) 10%, transparent) 50%, color-mix(in srgb, var(--color-text) 6%, transparent) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .dd-note { padding: 10px 14px 12px; font-size: 0.75rem; color: var(--color-text-muted); }
  .dd-note.err { color: var(--color-danger); font-weight: 600; }

  /* 新建供应商（内联展开卡） */
  .pform-card { margin-top: 4px; }
  .pform { padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--color-accent) 4%, var(--color-panel-soft)); }
  .pform .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pform label { display: grid; gap: 4px; font-size: 0.75rem; color: var(--color-text-muted); }
  .pform input { border: 1px solid var(--color-border); border-radius: var(--radius-sm); background: var(--color-panel-soft); padding: 6px 10px; font-size: 0.8125rem; }
  .req::after { content: " *"; color: var(--color-danger); }
  .frow { display: flex; gap: 8px; justify-content: flex-end; }

  .toast-wrap { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 1000; align-items: center; }
  .toast { display: flex; align-items: center; gap: 10px; background: var(--color-text); color: #FCFAF5; font-size: 0.8125rem; padding: 9px 12px 9px 16px; border-radius: var(--radius-md); box-shadow: var(--elevation-3); animation: t-in var(--duration-slow) var(--ease-spring); }
  .toast.out { animation: t-out var(--duration-base) var(--ease-out) forwards; }
  @keyframes t-in { from { opacity: 0; transform: translateY(12px); } }
  @keyframes t-out { to { opacity: 0; transform: translateY(8px); } }
  .toast button { border: 0; background: color-mix(in srgb, #FCFAF5 14%, transparent); color: #FCFAF5; font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: var(--radius-xs); }

  .scrim { position: fixed; inset: 0; background: rgba(59,61,63,0.4); backdrop-filter: blur(2px); display: none; place-items: center; z-index: 900; }
  .scrim.show { display: grid; }
  .dialog { width: 400px; background: var(--color-panel-soft); border-radius: var(--radius-lg); box-shadow: var(--elevation-3); padding: 22px 24px; animation: t-in var(--duration-slow) var(--ease-spring); }
  .dialog h3 { margin: 0 0 8px; font-size: 1rem; }
  .dialog p { margin: 0 0 18px; font-size: 0.8125rem; color: var(--color-text-muted); }
</style>
</head>
<body>
<div class="app">
  <nav class="app-nav" aria-label="主导航">
    <div class="app-brand">Claude Link</div>
    <a href="#"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>会话</a>
    <a href="#" class="active"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</a>
  </nav>

  <main class="settings">
    <div class="settings-inner">
      <div class="page-head">
        <h1>设置</h1>
        <span class="proto-tag">V1-r2b · 供应商标签条 + 查询模型下拉</span>
      </div>
      <nav class="tabs" aria-label="设置分类">
        <button class="active">连接</button><button>行为</button><button>外观</button>
      </nav>

      <!-- 供应商标签条 -->
      <div class="pills-row" id="pillsRow"></div>
      <div class="card pform-card" id="pFormCard" hidden>
        <div class="pform">
          <div class="grid2">
            <label class="req">名称<input id="fName" placeholder="例如：DeepSeek 官方" /></label>
            <label class="req">请求地址（Base URL）<input id="fUrl" placeholder="https://api.deepseek.com/anthropic" /></label>
          </div>
          <label>API Key<input id="fKey" type="password" placeholder="sk-…" /></label>
          <div class="frow"><button class="btn sm" id="fCancel">取消</button><button class="btn sm primary" id="fSave">创建供应商</button></div>
        </div>
      </div>

      <!-- 供应商详情 + 我的模型 -->
      <section class="pdetail" id="pDetail" style="margin-top:16px"></section>
    </div>
  </main>
</div>

<div class="toast-wrap" id="toasts"></div>
<div class="scrim" id="scrim"><div class="dialog" role="alertdialog" aria-modal="true" id="dialogBox"></div></div>

<script>
/* ══ Mock 数据（与 v1/v2/v3/r2b 共用同一套，保证可比） ══ */
const ICON = {
  server: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>',
  refresh: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>',
  trash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  plus: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  zap: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  undo: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
};
const AVAILABLE = {
  p1: [['glm-4.7','GLM-4.7 旗舰',98304],['glm-4.7-air','GLM-4.7 Air 轻量',65536],['glm-4.6','GLM-4.6',98304],['glm-4.5-air','GLM-4.5 Air',65536],['glm-4.5-flash','GLM-4.5 Flash 免费',32768],['glm-4v-plus','GLM-4V Plus 视觉',16384],['glm-4-long','GLM-4 Long 长文本',1048576],['glm-4-flashx','GLM-4 FlashX',32768],['glm-4-air-250414','GLM-4 Air 250414',65536],['glm-4-plus','GLM-4 Plus',98304],['codegeex-4','CodeGeeX-4 编程',32768],['glm-zero-preview','GLM Zero Preview',32768]],
  p2: [['claude-opus-4-6','Claude Opus 4.6',32768],['claude-sonnet-4-6','Claude Sonnet 4.6',65536],['claude-sonnet-4-5','Claude Sonnet 4.5',65536],['claude-haiku-4-5','Claude Haiku 4.5',32768],['claude-3-7-sonnet','Claude 3.7 Sonnet',65536],['claude-3-5-haiku','Claude 3.5 Haiku',8192]],
  p3: [['claude-opus-4-6','Claude Opus 4.6',32768],['claude-sonnet-4-6','Claude Sonnet 4.6',65536],['claude-sonnet-4-5','Claude Sonnet 4.5',65536],['gpt-5.2','GPT-5.2（兼容层）',131072],['gemini-3-pro','Gemini 3 Pro（兼容层）',1048576],['deepseek-v3.2','DeepSeek V3.2（兼容层）',131072],['kimi-k2.5','Kimi K2.5（兼容层）',262144]],
};
function m(id, name, tok, src) { return { id, name, tok, src, addedAt: Date.now() }; }
let providers = [
  { id: 'p1', name: '智谱 GLM', note: '主力，性价比', url: 'https://open.bigmodel.cn/api/anthropic', key: '9f2c', active: true,
    models: [m('glm-4.7','GLM-4.7 旗舰',98304,'queried'), m('glm-4.7-air','GLM-4.7 Air 轻量',65536,'queried'), m('glm-4.6','GLM-4.6',98304,'queried')], def: 'glm-4.7' },
  { id: 'p2', name: 'Anthropic 官方', note: '', url: 'https://api.anthropic.com', key: 'a41b', active: false,
    models: [m('claude-sonnet-4-6','Claude Sonnet 4.6',65536,'queried'), m('claude-opus-4-6','Claude Opus 4.6',32768,'queried'), m('claude-haiku-4-5','Claude Haiku 4.5',32768,'queried')], def: 'claude-sonnet-4-6' },
  { id: 'p3', name: 'sub2api 中转', note: '备用线路', url: 'https://sub2api.example.com', key: '77e0', active: false,
    models: [m('claude-sonnet-4-6','Claude Sonnet 4.6',65536,'manual')], def: 'claude-sonnet-4-6' },
];
const queried = {}, queryState = {};
let selId = 'p1', qFilter = '';

const $ = (s) => document.querySelector(s);
const host = (u) => { try { return new URL(u).host; } catch { return u; } };
const cur = () => providers.find(p => p.id === selId);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, action) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span>${msg}</span>` + (action ? `<button type="button">${ICON.undo}${action.label}</button>` : '');
  if (action) el.querySelector('button').onclick = () => { action.fn(); kill(); };
  $('#toasts').appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 220); };
  setTimeout(kill, action ? 5000 : 2600);
}
function confirmDlg({ title, body, okText, onOk }) {
  const scrim = $('#scrim'), box = $('#dialogBox');
  box.innerHTML = `<h3>${title}</h3><p>${body}</p><div class="frow"><button class="btn" data-x>取消</button><button class="btn danger" data-ok>${okText}</button></div>`;
  scrim.classList.add('show');
  box.querySelector('[data-x]').onclick = () => scrim.classList.remove('show');
  box.querySelector('[data-ok]').onclick = () => { scrim.classList.remove('show'); onOk(); };
  scrim.onclick = (e) => { if (e.target === scrim) scrim.classList.remove('show'); };
}

/* ── 顶部供应商标签条 ── */
function renderPills() {
  $('#pillsRow').innerHTML = providers.map(p => `
    <button type="button" class="pill ${p.id === selId ? 'sel' : ''} ${p.active ? 'on' : ''}" data-pid="${p.id}" title="${esc(p.name)} · ${esc(host(p.url))}${p.active ? ' · 当前使用' : ''}">
      <span class="dot"></span>${esc(p.name)}<span class="cnt">${p.models.length}</span>
    </button>`).join('') + `
    <button type="button" class="pill pill-add" id="pillAdd">${ICON.plus}新建</button>`;
  document.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => { selId = b.dataset.pid; qFilter = ''; cbxOpen = false; render(); });
  $('#pillAdd').onclick = () => { $('#pFormCard').hidden = false; $('#fName').focus(); };
}

/* ── 供应商详情 + 我的模型 ── */
let cbxOpen = false; // 查询模型下拉是否展开
function renderDetail() {
  const p = cur();
  $('#pDetail').innerHTML = `
    <div class="card">
      <div class="d-head">
        <div class="d-ava">${ICON.server}</div>
        <div class="d-title">
          <div class="row1"><h2>${esc(p.name)}</h2>${p.active ? '<span class="badge-on">当前使用</span>' : ''}</div>
          <div class="sub">
            <span>地址 <code>${esc(p.url)}</code></span>
            <span>Key <code>sk-…****${esc(p.key)}</code></span>
            ${p.note ? `<span>备注 ${esc(p.note)}</span>` : ''}
          </div>
        </div>
        <div class="d-actions">
          ${p.active ? '' : `<button class="btn" id="aUse">设为当前使用</button>`}
          <button class="btn" id="aTest">${ICON.zap}测试连接</button>
          <button class="btn ghost-danger" id="aDel" aria-label="删除供应商">${ICON.trash}删除</button>
        </div>
      </div>
      <div class="card-head">
        <h3>我的模型</h3>
        <span style="font-size:.75rem;color:var(--color-text-muted)">${p.models.length} 个 · 默认 <code style="font-family:var(--font-mono)">${esc(p.def || '未设置')}</code></span>
        <div class="spacer"></div>
        <div class="cbx" id="cbx">
          <button class="btn primary" id="cbxBtn" aria-haspopup="listbox" aria-expanded="${cbxOpen}">${ICON.search}查询模型${ICON.chev}</button>
          ${cbxOpen ? renderCbx() : ''}
        </div>
      </div>
      ${renderMyModels(p)}
    </div>`;

  $('#aTest').onclick = () => toast('已发起连接测试（复用现有测试连接弹窗）');
  const use = $('#aUse'); if (use) use.onclick = () => { providers.forEach(x => x.active = false); p.active = true; render(); toast(`已切换到「${esc(p.name)}」，配置已生效`); };
  const del = $('#aDel'); if (del) del.onclick = () => confirmDlg({
    title: `删除供应商「${esc(p.name)}」？`,
    body: `将同时删除其 ${p.models.length} 个模型配置。删除后可撤销。`,
    okText: '删除',
    onOk: () => {
      const i = providers.indexOf(p), snap = p;
      providers.splice(i, 1);
      if (selId === p.id) selId = providers[0]?.id || null;
      render();
      toast(`已删除供应商「${esc(p.name)}」`, { label: '撤销', fn: () => { providers.splice(i, 0, snap); selId = snap.id; render(); } });
    },
  });
  bindMyModels(p);
  bindCbx(p);
}

function renderMyModels(p) {
  if (!p.models.length) {
    return `<div class="empty">还没有模型。点右上角 <b>「查询模型」</b>从端点拉取并点击添加，<br>或在下拉框中手动输入模型 ID 后点「确认」。</div>`;
  }
  const rows = p.models.map(mm => `
    <div class="mrow" data-mid="${esc(mm.id)}">
      <input type="radio" class="radio" name="def" ${p.def === mm.id ? 'checked' : ''} title="设为默认模型" aria-label="将 ${esc(mm.id)} 设为默认模型" />
      <span class="mid" title="${esc(mm.id)}">${esc(mm.id)}<span class="nm">${esc(mm.name)}</span></span>
      <span class="mtok">${mm.tok ? (mm.tok / 1024 | 0) + 'k tok' : '—'}</span>
      <span class="tag ${p.def === mm.id ? 'def' : mm.src}">${p.def === mm.id ? '默认' : mm.src === 'queried' ? '查询' : '手动'}</span>
      <button type="button" class="icon-btn" data-del="${esc(mm.id)}" aria-label="删除模型 ${esc(mm.id)}" title="删除">${ICON.trash}</button>
    </div>`).join('');
  return `<div class="mlist">${rows}</div>`;
}

function bindMyModels(p) {
  document.querySelectorAll('.mrow .radio').forEach(r => r.onchange = () => { p.def = r.closest('.mrow').dataset.mid; renderDetail(); toast(`默认模型已设为 <b>${esc(p.def)}</b>`); });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    const id = b.dataset.del;
    const idx = p.models.findIndex(x => x.id === id);
    const removed = p.models.splice(idx, 1)[0];
    if (p.def === id) p.def = p.models[0]?.id || null;
    render();
    toast(`已删除模型 ${esc(id)}`, { label: '撤销', fn: () => { p.models.splice(idx, 0, removed); if (!p.def) p.def = removed.id; render(); } });
  });
}

/* ── 查询模型组合框：点击即添加 / 手动输入 + 确认 ── */
function renderCbx() {
  const st = queryState[selId] || 'idle';
  let bodyHtml = '';
  if (st === 'idle' || st === 'loading') {
    bodyHtml = st === 'loading'
      ? `<div class="skel"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>`
      : `<div class="dd-note">正在从 ${esc(host(cur().url))}/v1/models 拉取…</div>`;
  } else {
    const filter = qFilter.toLowerCase();
    const list = (queried[selId] || []).filter(x => x.id.toLowerCase().includes(filter) || x.name.toLowerCase().includes(filter));
    const addedSet = new Set(cur().models.map(x => x.id));
    bodyHtml = `<div class="dd-list">${list.length ? list.map(x => {
      const added = addedSet.has(x.id);
      return `<button type="button" class="qrow" data-qid="${esc(x.id)}" ${added ? 'disabled' : ''}>
        <span class="qid" title="${esc(x.id)}">${esc(x.id)}<span class="nm">${esc(x.name)}</span></span>
        <span class="mtok">${x.tok ? (x.tok / 1024 | 0) + 'k' : '—'}</span>
        ${added ? `<span class="qok">${ICON.check}已添加</span>` : `<span class="qadd">＋ 点击添加</span>`}
      </button>`;
    }).join('') : `<div class="dd-note">列表中没有「${esc(qFilter)}」。<br>如果这是网关自定义模型，直接点右侧「确认」手动添加。</div>`}</div>`;
  }
  return `<div class="dd cbx-dd">
    <div class="cbx-head">
      <div class="searchbox">${ICON.search}<input id="ddInput" placeholder="搜索模型，或输入自定义模型 ID" value="${esc(qFilter)}" autocomplete="off" spellcheck="false" /></div>
      <button class="btn sm primary" id="ddConfirm">确认</button>
      <button class="icon-btn plain" id="ddRefresh" title="重新查询" aria-label="重新查询">${ICON.refresh}</button>
    </div>
    ${bodyHtml}
  </div>`;
}

function bindCbx(p) {
  const btn = $('#cbxBtn');
  if (!btn) return;
  btn.onclick = (e) => {
    e.stopPropagation();
    cbxOpen = !cbxOpen;
    if (cbxOpen && (queryState[p.id] || 'idle') === 'idle') runQuery(p);
    renderDetail();
    if (cbxOpen) setTimeout(() => $('#ddInput')?.focus(), 30);
  };
  if (!cbxOpen) return;

  const input = $('#ddInput');
  if (input) {
    input.oninput = () => { qFilter = input.value; refreshCbxList(); };
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); manualAdd(p); }
      if (e.key === 'Escape') { cbxOpen = false; renderDetail(); }
    };
  }
  $('#ddConfirm').onclick = () => manualAdd(p);
  $('#ddRefresh').onclick = () => runQuery(p);
  bindCbxRows(p);
}
function bindCbxRows(p) {
  document.querySelectorAll('.qrow:not(:disabled)').forEach(r => r.onclick = (e) => {
    e.stopPropagation();
    const info = (queried[p.id] || []).find(x => x.id === r.dataset.qid);
    p.models.push(m(info.id, info.name, info.tok, 'queried'));
    if (!p.def) p.def = info.id;
    renderDetail();
    toast(`已添加 <b>${esc(info.id)}</b> 到「${esc(p.name)}」`);
    setTimeout(() => $('#ddInput')?.focus(), 30);
  });
}
/* 只刷新下拉列表区：输入过滤时输入框节点不动（IME 安全） */
function refreshCbxList() {
  const p = cur();
  const dd = $('.cbx-dd');
  if (!dd) return;
  const st = queryState[p.id] || 'idle';
  if (st !== 'done') return;
  const filter = qFilter.toLowerCase();
  const list = (queried[p.id] || []).filter(x => x.id.toLowerCase().includes(filter) || x.name.toLowerCase().includes(filter));
  const addedSet = new Set(p.models.map(x => x.id));
  dd.querySelector('.dd-list').innerHTML = list.length ? list.map(x => {
    const added = addedSet.has(x.id);
    return `<button type="button" class="qrow" data-qid="${esc(x.id)}" ${added ? 'disabled' : ''}>
      <span class="qid" title="${esc(x.id)}">${esc(x.id)}<span class="nm">${esc(x.name)}</span></span>
      <span class="mtok">${x.tok ? (x.tok / 1024 | 0) + 'k' : '—'}</span>
      ${added ? `<span class="qok">${ICON.check}已添加</span>` : `<span class="qadd">＋ 点击添加</span>`}
    </button>`;
  }).join('') : `<div class="dd-note">列表中没有「${esc(qFilter)}」。<br>如果这是网关自定义模型，直接点右侧「确认」手动添加。</div>`;
  bindCbxRows(p);
}
function manualAdd(p) {
  const input = $('#ddInput');
  const id = (input?.value || '').trim();
  if (!id) { toast('请输入模型 ID'); input?.focus(); return; }
  if (p.models.some(x => x.id === id)) { toast(`「${esc(id)}」已在列表中，不可重复添加`); input?.focus(); return; }
  p.models.push(m(id, id, 0, 'manual'));
  if (!p.def) p.def = id;
  renderDetail();
  toast(`已手动添加模型 <b>${esc(id)}</b>`);
  setTimeout(() => $('#ddInput')?.focus(), 30);
}
function runQuery(p) {
  queryState[p.id] = 'loading';
  renderDetail();
  setTimeout(() => {
    queried[p.id] = (AVAILABLE[p.id] || []).map(([id, name, tok]) => ({ id, name, tok }));
    queryState[p.id] = 'done';
    if (selId === p.id && cbxOpen) { renderDetail(); setTimeout(() => $('#ddInput')?.focus(), 30); }
  }, 900);
}

/* 点外部/ESC 关闭查询下拉 */
document.addEventListener('click', (e) => {
  if (cbxOpen && !e.target.closest('#cbx')) { cbxOpen = false; qFilter = ''; renderDetail(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && cbxOpen) { cbxOpen = false; qFilter = ''; renderDetail(); }
});

/* ── 新建供应商 ── */
$('#fCancel').onclick = () => { $('#pFormCard').hidden = true; };
$('#fSave').onclick = () => {
  const name = $('#fName').value.trim(), url = $('#fUrl').value.trim(), key = $('#fKey').value.trim();
  if (!name || !url) { toast('名称和请求地址为必填'); return; }
  const id = 'p' + (Date.now() % 100000);
  AVAILABLE[id] = [];
  providers.push({ id, name, note: '', url, key: key ? key.slice(-4) : '未设', active: false, models: [], def: null });
  selId = id; qFilter = ''; cbxOpen = false;
  $('#pFormCard').hidden = true;
  $('#fName').value = ''; $('#fUrl').value = ''; $('#fKey').value = '';
  render();
  toast(`已创建供应商「${esc(name)}」，点「查询模型」开始添加模型`);
};

function render() { renderPills(); if (cur()) renderDetail(); else $('#pDetail').innerHTML = `<div class="card"><div class="empty">还没有供应商。点上方<b>「新建」</b>开始。</div></div>`; }
render();
</script>
</body>
</html>
